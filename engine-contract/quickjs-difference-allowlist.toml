# Known QuickJS defects relative to the SpiderMonkey contract.
#
# SpiderMonkey is the reference implementation. Each entry names one case and the compared fields
# that may differ. The comparison still prints every known defect; an unlisted difference fails
# the run. Never add an entry merely to silence a failure, and remove it when the shim is fixed.
#
# status:   pending | bug | known-bug | accepted | wontfix. accepted and wontfix are released as
#           accepted behaviour differences, and known-bug is released as a shim defect that is
#           tracked by an issue; all three keep the gate green but stay visible in the report.
#           pending and bug still fail the comparison.
# severity: P0 | P1 | P2 | P3. P0 and P1 cannot be released as accepted/wontfix/known-bug.
#
# Optional: `issue` links the tracking issue for a difference that is still present. `pending`,
# `bug` and `known-bug` entries must name a real tracking issue; accepted/wontfix entries may
# omit it.
#
# Optional: `steps` names the sub-scenarios whose failures this entry covers. Every
# `fields.step_failures` entry in either result must appear here; without it a newly exposed
# sub-scenario would be absorbed by a case-level `fields` entry.
#
# Optional: `panic` is an exact QuickJS panic fingerprint. Use it instead of relying on
# `fields = ["fields"]` for a case that aborts: panic text that changes, or a panic where none is
# listed, fails the comparison. When a difference is fixed, add a record to
# `quickjs-shim-fix-records.md`, then
# delete the entry here.

[[difference]]
id = "rooter.trace_on_gc"
fields = ["fields"]
panic = "the custom rooter trace callback did not run during an explicit collection"
reason = "Known shim defect (unfiled; ready-to-file text in engine-contract/known-bug-issues.md, entry 1): QuickJS does not invoke CustomAutoRooter trace callbacks during an explicit collection."
owner = "servo-quickjs"
issue = "unfiled: engine-contract/known-bug-issues.md#1"
status = "known-bug"
severity = "P3"

[[difference]]
id = "eval.environment_chain"
fields = ["fields", "apis"]
steps = ["environment_chain"]
panic = """assertion `left == right` failed
  left: 12
 right: 13"""
reason = "Known shim defect (tracked in https://github.com/openharmony-rs/servo-ohos/issues/57): QuickJS wraps environment-chain scopes in append order, so a later appended outer scope shadows an earlier inner scope; SpiderMonkey gives earlier appends precedence."
owner = "servo-quickjs"
issue = "https://github.com/openharmony-rs/servo-ohos/issues/57"
status = "known-bug"
severity = "P2"

[[difference]]
id = "objects.core"
fields = ["fields", "apis"]
steps = ["property_keys"]
panic = """assertion `left == right` failed
  left: ([3], 1)
 right: ([], 0)"""
reason = "JSITER_SYMBOLSONLY is a proxy-only flag in SpiderMonkey; QuickJS also treats it as symbol selection for ordinary objects"
owner = "servo-quickjs"
status = "accepted"
severity = "P3"

[[difference]]
